<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFs - IES Valle del Alberche</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .header-left h1 { font-size: 1.8em; margin: 0; }
        .header-left p { margin: 6px 0 0 0; font-size: 1em; }
        .header-sub {
            display: flex; align-items: center; gap: 8px;
            margin-top: 6px; flex-wrap: wrap;
        }
        .header-sub img {
            max-height: 28px; width: auto; border-radius: 4px;
            background: white; padding: 2px;
        }
        .header-sub .codigo { font-weight: 700; font-size: 1.1em; }
        .header-sub .texto { font-size: 1.1em; }
        .header-right img {
            max-height: 70px; max-width: 180px; object-fit: contain; display: block;
        }
        .section {
            padding: 25px 30px; margin: 15px;
            border-radius: 12px; border-left: 5px solid #a0aec0;
            background: #f7fafc;
        }
        .section h2 {
            font-size: 1.5em; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px; color: #2d3748;
        }
        .section h2 i { color: #4a5568; }

        .lista-pdfs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px 20px;
        }
        .pdf-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .pdf-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
            transform: translateY(-2px);
        }
        .pdf-item i {
            color: #e53e3e;
            font-size: 1.3em;
            width: 22px; text-align: center;
        }
        .pdf-item a {
            text-decoration: none; color: #2d3748;
            font-weight: 500; font-size: 0.98em;
            flex: 1;
            word-break: break-word;
        }
        .pdf-item a:hover { color: #2b6cb0; text-decoration: underline; }

        .footer-cierre {
            text-align: center; padding: 30px 20px 20px;
            margin-top: 10px; position: relative;
        }
        .footer-cierre::before {
            content: ''; display: block; width: 60px; height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 20px auto; border-radius: 4px;
        }
        .footer-cierre .icono-cierre {
            font-size: 2.2em; color: #a0aec0;
            transition: all 0.3s ease; display: inline-block;
        }
        .footer-cierre .icono-cierre:hover {
            color: #667eea; transform: scale(1.15) rotate(5deg);
        }

        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-right { align-self: center; }
            .lista-pdfs { grid-template-columns: 1fr; }
            .section { padding: 18px 16px; margin: 10px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="header-left">
            <h1>IES Valle del Alberche</h1>
            <div class="header-sub">
                <img src="../img_comunes/Cápsula.png" width="40" height="auto" alt="">
                <span class="codigo">#PDFs</span>
                <span class="texto">Documentos de las unidades</span>
            </div>
        </div>
        <div class="header-right">
            <img src="../img_comunes/Valle del Alberche v2-Small.png" alt="Logo del centro">
        </div>
    </div>

    <div class="section">
        <h2><i class="fas fa-file-pdf"></i> Documentos PDF disponibles</h2>

        <!-- Los PDFs se generan aquí automáticamente desde la lista de abajo -->
        <div id="listaPDFs" class="lista-pdfs"></div>

        <div class="footer-cierre">
            <div class="icono-cierre">
                <i class="fas fa-chevron-circle-down"></i>
            </div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // 👇 EDITA AQUÍ: escribe los nombres EXACTOS de tus archivos PDF
    //    (con extensión .pdf, respetando mayúsculas y tildes)
    // ============================================================
    const PDFS = [
        "Practica_Densidad_Cuaderno_Laboratorio_4ESO_A modo de ejemplo.pdf",
        "Practica_Densidad_Cuaderno_Laboratorio_4ESO.pdf",
        "Toma_de_datos_Laboratorio_Ciencias_4ESO.pdf" //Pon una coma al final de cada línea excepto en la última
        // Añade o quita líneas según tus archivos reales








        
    ];

    function renderizarPDFs() {
        const contenedor = document.getElementById('listaPDFs');
        if (!PDFS.length) {
            contenedor.innerHTML = '<p style="color:#718096;">No hay PDFs disponibles.</p>';
            return;
        }
        contenedor.innerHTML = PDFS.map(nombre => {
            // Quitamos la extensión .pdf para mostrarlo más limpio
            const etiqueta = nombre.replace(/\.pdf$/i, '');
            return `
                <div class="pdf-item">
                    <i class="fas fa-file-pdf"></i>
                    <a href="${encodeURIComponent(nombre)}" target="_blank" rel="noopener">${etiqueta}</a>
                </div>
            `;
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderizarPDFs);
</script>
</body>
</html>
